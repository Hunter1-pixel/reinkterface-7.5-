[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv

; XIAO ESP32-S3 Plus has 8MB OPI PSRAM which we need for the 800x480 1bpp
; framebuffer (~48KB) plus Adafruit_GFX working memory. Without this
; build_flag, the GDEY075T7 full-screen buffer allocation fails on boot.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    zinggjm/GxEPD2
    h2zero/NimBLE-Arduino
